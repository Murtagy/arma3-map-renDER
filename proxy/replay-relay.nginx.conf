worker_processes 1;
pid /run/replay-relay/nginx.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /run/replay-relay/client;
    proxy_temp_path /run/replay-relay/proxy;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 1k;
    keepalive_timeout 5s;
    send_timeout 30s;

    map_hash_bucket_size 128;
    include /etc/replay-relay/auth.conf;
    limit_req_zone $server_name zone=replay_rate:1m rate=5r/s;
    limit_conn_zone $server_name zone=replay_connections:1m;
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 127.0.0.1:8797;
        server_name _;
        limit_req zone=replay_rate burst=10 nodelay;
        limit_conn replay_connections 8;
        limit_req_status 429;
        limit_conn_status 429;

        location = /replay {
            if ($replay_authorized = 0) { return 401; }
            if ($request_method != GET) { return 405; }
            if ($arg_a !~ "^(l|gl)$") { return 403; }

            # PHP uses the last duplicate action: force the validated action last.
            proxy_pass https://replay.tsgames.ru/rv/ajax.php?$args&a=$arg_a;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host replay.tsgames.ru;
            proxy_set_header User-Agent arma3-map-render-replay-proxy/1.0;
            proxy_set_header Accept "application/json, text/plain, */*";
            proxy_set_header Connection "";
            proxy_set_header Content-Length "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Location;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name replay.tsgames.ru;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 5;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
            proxy_buffering off;
            proxy_redirect off;
        }

        location / {
            return 404;
        }
    }
}
